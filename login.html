<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HomePhysio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }

    .form-container {
      position: relative;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      width: 300px;
    }

    .close-btn,
    .back-btn {
      position: absolute;
      top: 10px;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      color: #333;
    }

    .close-btn {
      right: 15px;
    }

    .close-btn:hover {
      color: #00aaff;
    }

    .back-btn {
      left: 15px;
    }

    .back-btn:hover {
      color: #00aaff;
    }

    h2 {
      text-align: center;
      color: #00aaff;
      font-weight: bold;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      height: 40px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #00aaff;
      color: white;
      cursor: pointer;
    }

    .clear-btn {
      background: #e44848;
      color: #333;
      margin-top: 5px;
    }

    /* Password wrapper */
    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .password-wrapper input {
      width: 100%;
      padding-right: 35px;
      height: 40px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .password-wrapper .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #555;
      font-size: 1.1rem;
      user-select: none;
    }
  </style>
</head>

<body>

  <div class="form-container">
    <span class="close-btn" onclick="window.location.href='index.html'">&times;</span>
    <span class="back-btn" onclick="window.location.href='register.html'">&#8592;</span>
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>

      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Password" required>
        <span class="toggle-password" data-target="password"
          style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #555;">
          <i class="fa-regular fa-eye"></i>
        </span>
      </div>

      <button type="submit">Login</button>
      <button type="button" class="clear-btn" onclick="clearFields()">Clear</button>
    </form>
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>

  <script src="js/config.js"></script>
  <script>

    // ✅ Toggle password visibility
    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const targetId = button.getAttribute("data-target");
        const input = document.getElementById(targetId);
        const icon = button.querySelector("i");

        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
          icon.style.color = "#00aaff"; // eye color changes when active
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
          icon.style.color = "#555";
        }
      });
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        let res, data;

        if (email === "admin@gmail.com") {
          // Admin login
          res = await fetch(`${API_BASE_URL}/admin/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password })
          });

          data = await res.json();

          if (res.ok && data.msg === "Admin login successful!") {
            localStorage.setItem("loggedInEmail", email);
            alert("Admin successfully logged in!");
            window.location.href = "admin.html"; // redirect admin
          } else {
            alert(data.msg || "Access denied. Invalid credentials!");
          }

        } else {
          // Normal user login
          res = await fetch(`${API_BASE_URL}/login`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });

          data = await res.json();

          if (res.ok && data.user) {
            localStorage.setItem("userName", data.user.name);
            localStorage.setItem("userEmail", data.user.email);
            alert("User successfully logged in!");
            window.location.href = "profile.html";
          } else {
            alert(data.msg || "Login failed. Please check your details.");
          }
        }


      } catch (err) {
        console.error(err);
        alert("An error occurred during login. Please try again.");
      }
    });


  </script>

</body>

</html>
