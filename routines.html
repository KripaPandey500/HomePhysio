<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Routines - HomePhysio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
:root {
  --primary-color: #0077cc;
  --accent-color: #005fa3;
}

body {
  background-color: #ffffff;
  color: #333;
  transition: background 0.3s, color 0.3s;
  font-family: "Poppins", sans-serif;
}

section.content {
  padding: 6rem 2rem 3rem 2rem;
  max-width: 1100px;
  margin: auto;
}

h1 {
  color: var(--primary-color);
  text-align: center;
  margin-bottom: 0.5rem;
}

p.subtext {
  text-align: center;
  color: #415572;
  margin-bottom: 2rem;
}

.buttons-container {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin: 2rem 0;
  flex-wrap: wrap;
}

.buttons-container button {
  padding: 0.8rem 1.8rem;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  font-weight: 600;
  background: var(--primary-color);
  color: white;
  transition: 0.3s;
}

.buttons-container button:hover {
  background: var(--accent-color);
}

.buttons-container button.active {
  background: var(--accent-color);
  transform: scale(1.05);
}

/* ===== Routine List ===== */
.routine-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 900px;
  margin: 20px auto;
  width: 100%;
}

.routine-item {
  display: flex;
  flex-direction: column;
  padding: 14px 18px;
  background: #f8faff;
  border-radius: 12px;
  border: 1px solid #ddd;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
  transition: all 0.3s ease;
  width: 100%;
}

.routine-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.routine-header:hover {
  background: #eaf4ff;
  transform: translateY(-2px);
}

.routine-info {
  flex: 1;
  font-size: 1.05rem;
  font-weight: 600;
  color: #637589;
  text-align: left;
  overflow-wrap: break-word;
}

.routine-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.routine-actions i {
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--primary-color);
  transition: color 0.3s, transform 0.2s;
}

.routine-actions i:hover {
  color: var(--accent-color);
  transform: scale(1.2);
}

/* ===== Exercise Cards ===== */
.exercise-list {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.exercise-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  min-width: 250px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  border: 1px solid #ddd;
}

.exercise-card span {
  font-weight: 500;
  color: #333;
}

.exercise-card i {
  cursor: pointer;
  margin-left: 10px;
  font-size: 1.1rem;
  color: var(--primary-color);
  transition: 0.2s;
}

.exercise-card i:hover {
  color: var(--accent-color);
  transform: scale(1.2);
}

/* ===== Dark Mode ===== */
body.dark-mode {
  background-color: #121212;
  color: #e0e0e0;
}

body.dark-mode .routine-item {
  background-color: #1e1e1e;
  color: #e0e0e0;
  border: 1px solid #444;
  box-shadow: 0 2px 8px rgba(255, 255, 255, 0.05);
}

body.dark-mode .routine-header:hover {
  background-color: #2a2a2a;
}

body.dark-mode .routine-info {
  color: #e0e0e0;
}

body.dark-mode .routine-actions i {
  color: #8ab4f8;
}

body.dark-mode .routine-actions i:hover {
  color: #3b7ad9;
}

body.dark-mode .exercise-card {
  background: #1e1e1e;
  color: #e0e0e0;
  border: 1px solid #444;
  box-shadow: 0 2px 5px rgba(255, 255, 255, 0.05);
}

body.dark-mode .exercise-card span {
  color: #e0e0e0;
}

body.dark-mode .exercise-card i {
  color: #8ab4f8;
}

body.dark-mode .exercise-card i:hover {
  color: #3b7ad9;
}

/* ===== Build Routine Section ===== */
.form-section {
  display: none;
  margin-top: 2rem;
  background: #e6f7ff;
  padding: 1.5rem;
  border-radius: 10px;
  text-align: center;
}

.form-section input[type="text"] {
  padding: 0.7rem;
  width: 60%;
  border: 1px solid #ccc;
  border-radius: 5px;
  margin-right: 0.5rem;
}

.form-section button {
  padding: 0.7rem 1.3rem;
  border: none;
  border-radius: 5px;
  background: var(--primary-color);
  color: white;
  cursor: pointer;
  transition: background 0.3s;
}

.form-section button:hover {
  background: var(--accent-color);
}

/* Dark mode for Build Routine Section */
body.dark-mode .form-section {
  background-color: #1e1e1e;
  color: #e0e0e0;
}

body.dark-mode .form-section input[type="text"] {
  background-color: #252525;
  color: #e0e0e0;
  border: 1px solid #555;
}

body.dark-mode .form-section button {
  background-color: #0077cc;
  color: white;
}

body.dark-mode .form-section button:hover {
  background-color: #005fa3;
}

/* Empty Message */
body.dark-mode #emptyMessage p {
  color: #e0e0e0;
}

  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="assets/images/logo.png" alt="HomePhysio Logo">
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="exercises.html">Exercises</a>
      <a href="routines.html">My Routines</a>
      <a href="progress.html">My Progress</a>
      <a href="aboutus.html">About Us</a>
      <a href="register.html"><i class="fas fa-user-circle"></i></a>
      <button id="theme-toggle" class="theme-toggle">
        <i id="theme-icon" class="fas fa-moon"></i>
      </button>
    </nav>
  </header>

  <section class="content">
    <h1>My Routines</h1>
    <p class="subtext">Manage and follow your personalized physiotherapy exercises.</p>

    <div class="buttons-container">
      <button id="myRoutineBtn">My Routine</button>
      <button id="buildRoutineBtn">Build Your Routine</button>
    </div>

    <section class="routine-grid" id="routineGrid"></section>
    <div class="empty-message" id="emptyMessage" style="display:none;">
      <p>No routines yet! Create your routine now.</p>
    </div>

    <div class="form-section" id="buildRoutineSection">
      <h3>Create New Routine</h3>
      <input type="text" id="routineName" placeholder="Enter routine name">
      <button id="saveRoutine">Save Routine</button>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 HomePhysio | Follow us on social media</p>
  </footer>

<script>
const routineGrid = document.getElementById("routineGrid");
const buildRoutineSection = document.getElementById("buildRoutineSection");
const myRoutineBtn = document.getElementById("myRoutineBtn");
const buildRoutineBtn = document.getElementById("buildRoutineBtn");
const emptyMessage = document.getElementById("emptyMessage");
const routineNameInput = document.getElementById("routineName");
const saveRoutineBtn = document.getElementById("saveRoutine");

// ===== Routines Data =====
function getRoutines() {
  return JSON.parse(localStorage.getItem("routines")) || [];
}
function saveRoutines(routines) {
  localStorage.setItem("routines", JSON.stringify(routines));
}

// ===== Save Routine =====
async function saveRoutine(name) {
  if (!name) return alert("Please enter a routine name!");
  const userEmail = localStorage.getItem("loggedInEmail");
  if (!userEmail) return alert("You must be logged in to create a routine!");
  const newRoutine = { name, exercises: [], userEmail };
  const routines = getRoutines();
  routines.push({ id: Date.now(), ...newRoutine });
  saveRoutines(routines);
  displayRoutineGrid();
  routineNameInput.value = "";
}

// ===== Display Routines =====
function displayRoutineGrid() {
  const routines = getRoutines();
  routineGrid.innerHTML = "";
  if (routines.length === 0) {
    emptyMessage.style.display = "block";
    return;
  }
  emptyMessage.style.display = "none";

  routines.forEach((routine) => {
    const div = document.createElement("div");
    div.classList.add("routine-item");
    div.innerHTML = `
      <div class="routine-header">
        <div class="routine-info" data-id="${routine.id}">${routine.name}</div>
        <div class="routine-actions">
          <i class="fas fa-plus-circle add-exercise" data-id="${routine.id}" title="Add Exercises"></i>
          <i class="fas fa-edit edit-routine" data-id="${routine.id}" title="Edit Routine"></i>
          <i class="fas fa-trash delete-routine" data-id="${routine.id}" title="Delete Routine"></i>
        </div>
      </div>
    `;

    if(routine.exercises && routine.exercises.length > 0){
      const exerciseList = document.createElement("div");
      exerciseList.classList.add("exercise-list");
      routine.exercises.forEach(ex => {
        const exCard = document.createElement("div");
        exCard.classList.add("exercise-card");
        exCard.innerHTML = `
          <span>${ex.name}</span>
          <div>
            <i class="fas fa-play-circle play-exercise" title="Play Video" data-url="${ex.video || '#'}"></i>
            <i class="fas fa-trash delete-exercise" title="Delete Exercise" data-routine="${routine.id}" data-ex="${ex._id}"></i>
          </div>
        `;
        exerciseList.appendChild(exCard);
      });
      div.appendChild(exerciseList);
    }

    routineGrid.appendChild(div);
  });
}

// ===== Routine Actions =====
routineGrid.addEventListener("click", (e) => {
  const target = e.target;
  const routines = getRoutines();

  if (target.classList.contains("delete-routine")) {
    const id = parseInt(target.dataset.id);
    saveRoutines(routines.filter(r => r.id !== id));
    displayRoutineGrid();
  }

  if (target.classList.contains("edit-routine")) {
    const id = parseInt(target.dataset.id);
    const routine = routines.find(r => r.id === id);
    if (!routine) return;
    const newName = prompt("Edit your routine name:", routine.name);
    if (!newName || newName.trim() === "") return;
    routine.name = newName.trim();
    saveRoutines(routines);
    displayRoutineGrid();
  }

  if (target.classList.contains("add-exercise")) {
    const id = parseInt(target.dataset.id);
    window.location.href = `exercises.html?routineId=${id}`;
  }

  if (target.classList.contains("play-exercise")) {
    const url = target.dataset.url;
    if(url && url !== "#") window.open(url, "_blank");
    else alert("No video available!");
  }

  if (target.classList.contains("delete-exercise")) {
    const routineId = parseInt(target.dataset.routine);
    const exId = target.dataset.ex;
    const routine = routines.find(r => r.id === routineId);
    if(routine && routine.exercises){
      routine.exercises = routine.exercises.filter(ex => ex._id !== exId);
      saveRoutines(routines);
      displayRoutineGrid();
    }
  }
});

// ===== Tabs =====
function resetTabs() {
  [myRoutineBtn, buildRoutineBtn].forEach(b => b.classList.remove("active"));
  routineGrid.style.display = "none";
  emptyMessage.style.display = "none";
  buildRoutineSection.style.display = "none";
}

myRoutineBtn.onclick = () => {
  resetTabs();
  myRoutineBtn.classList.add("active");
  routineGrid.style.display = "flex";
  displayRoutineGrid();
};

buildRoutineBtn.onclick = () => {
  resetTabs();
  buildRoutineBtn.classList.add("active");
  buildRoutineSection.style.display = "block";
};

// ===== Save Routine Button =====
saveRoutineBtn.addEventListener("click", () => {
  const name = routineNameInput.value.trim();
  if (!name) return alert("Please enter a routine name!");
  saveRoutine(name);
});

// ===== Dark Mode =====
const themeToggle = document.getElementById("theme-toggle");
const themeIcon = document.getElementById("theme-icon");
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-mode");
  themeIcon.classList.replace("fa-moon", "fa-sun");
}
themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  if (document.body.classList.contains("dark-mode")) {
    themeIcon.classList.replace("fa-moon", "fa-sun");
    localStorage.setItem("theme", "dark");
  } else {
    themeIcon.classList.replace("fa-sun", "fa-moon");
    localStorage.setItem("theme", "light");
  }
});

// ===== Tabs =====
function showMyRoutine() {
  myRoutineBtn.classList.add("active");
  buildRoutineBtn.classList.remove("active");
  routineGrid.style.display = "flex";
  displayRoutineGrid();
  buildRoutineSection.style.display = "none";
  emptyMessage.style.display = getRoutines().length === 0 ? "block" : "none";
}

function showBuildRoutine() {
  buildRoutineBtn.classList.add("active");
  myRoutineBtn.classList.remove("active");
  buildRoutineSection.style.display = "block";
  routineGrid.style.display = "none";
  emptyMessage.style.display = "none";
}

myRoutineBtn.addEventListener("click", showMyRoutine);
buildRoutineBtn.addEventListener("click", showBuildRoutine);

// ===== Initial Load =====
showMyRoutine(); // always show My Routine on page load

</script>

</body>
</html>
