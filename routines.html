<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Routines - HomePhysio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #0077cc;
      --accent-color: #005fa3;
    }
    body {
      background-color: #ffffff;
      color: #333;
      transition: background 0.3s, color 0.3s;
      font-family: "Poppins", sans-serif;
    }
    section.content {
      padding: 6rem 2rem 3rem 2rem;
      max-width: 1100px;
      margin: auto;
    }
    h1 {
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 0.5rem;
    }
    p.subtext {
      text-align: center;
      color: #415572;
      margin-bottom: 2rem;
    }
    .buttons-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0;
      flex-wrap: wrap;
    }
    .buttons-container button {
      padding: 0.8rem 1.8rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      background: var(--primary-color);
      color: white;
      transition: 0.3s;
    }
    .buttons-container button:hover {
      background: var(--accent-color);
    }
    .buttons-container button.active {
      background: var(--accent-color);
      transform: scale(1.05);
    }

    /* ===== Routine List ===== */
    .routine-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
      margin: 20px auto;
      width: 100%;
    }
    .routine-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #f8faff;
      border-radius: 12px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
      width: 100%;
    }
    .routine-item:hover {
      background: #eaf4ff;
      transform: translateY(-2px);
    }
    .routine-info {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 600;
      color: #637589;
      text-align: left;
      overflow-wrap: break-word;
    }
    .routine-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .routine-actions i {
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--primary-color);
      transition: color 0.3s, transform 0.2s;
    }
    .routine-actions i:hover {
      color: var(--accent-color);
      transform: scale(1.2);
    }

    /* ===== Dark Mode ===== */
    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }
    body.dark-mode .routine-item {
      background-color: #252525;
      color: #222c3d;
      border: 1px solid #333;
      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.05);
    }
    body.dark-mode .routine-item:hover {
      background-color: #e1dede;
    }
    body.dark-mode .routine-actions i {
      color: #8ab4f8;
    }
    body.dark-mode .routine-actions i:hover {
      color: #3b7ad9;
    }

    /* ===== Build Routine Section ===== */
    .form-section {
      display: none;
      margin-top: 2rem;
      background: #e6f7ff;
      padding: 1.5rem;
      border-radius: 10px;
      text-align: center;
    }
    .form-section input[type="text"] {
      padding: 0.7rem;
      width: 60%;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-right: 0.5rem;
    }
    .form-section button {
      padding: 0.7rem 1.3rem;
      border: none;
      border-radius: 5px;
      background: var(--primary-color);
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    .form-section button:hover {
      background: var(--accent-color);
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="assets/images/logo.png" alt="HomePhysio Logo">
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="exercises.html">Exercises</a>
      <a href="routines.html">My Routines</a>
      <a href="progress.html">My Progress</a>
      <a href="aboutus.html">About Us</a>
      <a href="register.html"><i class="fas fa-user-circle"></i></a>
      <button id="theme-toggle" class="theme-toggle">
        <i id="theme-icon" class="fas fa-moon"></i>
      </button>
    </nav>
  </header>

  <section class="content">
    <h1>My Routines</h1>
    <p class="subtext">Manage and follow your personalized physiotherapy exercises.</p>

    <div class="buttons-container">
      <button id="myRoutineBtn">My Routine</button>
      <button id="buildRoutineBtn">Build Your Routine</button>
    </div>

    <section class="routine-grid" id="routineGrid"></section>
    <div class="empty-message" id="emptyMessage" style="display:none;">
      <p>No routines yet! Create your routine now.</p>
    </div>

    <div class="form-section" id="buildRoutineSection">
      <h3>Create New Routine</h3>
      <input type="text" id="routineName" placeholder="Enter routine name">
      <button id="saveRoutine">Save Routine</button>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 HomePhysio | Follow us on social media</p>
  </footer>

<script>
const routineGrid = document.getElementById("routineGrid");
const buildRoutineSection = document.getElementById("buildRoutineSection");
const myRoutineBtn = document.getElementById("myRoutineBtn");
const buildRoutineBtn = document.getElementById("buildRoutineBtn");
const emptyMessage = document.getElementById("emptyMessage");
const routineNameInput = document.getElementById("routineName");
const saveRoutineBtn = document.getElementById("saveRoutine");

// ===== Routines Data =====
function getRoutines() {
  return JSON.parse(localStorage.getItem("routines")) || [];
}

function saveRoutines(routines) {
  localStorage.setItem("routines", JSON.stringify(routines));
}

// ===== Save Routine =====
async function saveRoutine(name) {
  if (!name) return alert("Please enter a routine name!");

  // Get user email from localStorage (assuming it’s stored after login)
  const userEmail = localStorage.getItem("loggedInEmail");
  if (!userEmail) return alert("You must be logged in to create a routine!");

  const newRoutine = { name, exercises: [], userEmail };

  // 1️⃣ Save locally
  const routines = getRoutines();
  routines.push({ id: Date.now(), ...newRoutine });
  saveRoutines(routines);
  displayRoutineGrid();

  // 2️⃣ Send to backend (MongoDB)
  try {
    const res = await fetch("http://localhost:5000/routines", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(newRoutine),
    });

    const data = await res.json();
    if (res.ok) {
      console.log("✅ Routine saved to MongoDB:", data);
      alert("Routine saved successfully to database!");
    } else {
      console.error("❌ Error saving to database:", data);
      alert("Saved locally, but failed to save to database!");
    }
  } catch (error) {
    console.error("❌ Server not reachable:", error);
    alert("Saved locally only (backend not reachable).");
  }

  routineNameInput.value = "";
}


// ===== Display Routines =====
function displayRoutineGrid() {
  const routines = getRoutines();
  routineGrid.innerHTML = "";

  if (routines.length === 0) {
    emptyMessage.style.display = "block";
    return;
  }
  emptyMessage.style.display = "none";

  routines.forEach((routine) => {
    const div = document.createElement("div");
    div.classList.add("routine-item");
    div.innerHTML = `
      <div class="routine-info" data-id="${routine.id}">${routine.name}</div>
      <div class="routine-actions">
        <i class="fas fa-plus-circle add-exercise" data-id="${routine.id}" title="Add Exercises"></i>
        <i class="fas fa-edit edit-routine" data-id="${routine.id}" title="Edit Routine"></i>
        <i class="fas fa-trash delete-routine" data-id="${routine.id}" title="Delete Routine"></i>
      </div>
    `;
    routineGrid.appendChild(div);
  });
}

// ===== Routine Actions =====
routineGrid.addEventListener("click", (e) => {
  const target = e.target;
  const routines = getRoutines();

  if (target.classList.contains("delete-routine")) {
    const id = parseInt(target.dataset.id);
    saveRoutines(routines.filter(r => r.id !== id));
    displayRoutineGrid();
  }

  if (target.classList.contains("edit-routine")) {
    const id = parseInt(target.dataset.id);
    const routine = routines.find(r => r.id === id);
    if (!routine) return;
    const newName = prompt("Edit your routine name:", routine.name);
    if (!newName || newName.trim() === "") return;
    routine.name = newName.trim();
    saveRoutines(routines);
    displayRoutineGrid();
    alert("Routine name updated successfully!");
  }

  if (target.classList.contains("add-exercise")) {
    const id = parseInt(target.dataset.id);
    alert(`Open exercise selection for routine ID: ${id}`);
    // You can call your existing exercise modal from exercises.html here
  }
});

// ===== Tabs =====
function resetTabs() {
  [myRoutineBtn, buildRoutineBtn].forEach(b => b.classList.remove("active"));
  routineGrid.style.display = "none";
  emptyMessage.style.display = "none";
  buildRoutineSection.style.display = "none";
}

myRoutineBtn.onclick = () => {
  resetTabs();
  myRoutineBtn.classList.add("active");
  routineGrid.style.display = "flex";
  displayRoutineGrid();
};

buildRoutineBtn.onclick = () => {
  resetTabs();
  buildRoutineBtn.classList.add("active");
  buildRoutineSection.style.display = "block";
};

// ===== Save Routine Button =====
saveRoutineBtn.addEventListener("click", () => {
  const name = routineNameInput.value.trim();
  if (!name) return alert("Please enter a routine name!");
  saveRoutine(name);
});

// ===== Dark Mode =====
const themeToggle = document.getElementById("theme-toggle");
const themeIcon = document.getElementById("theme-icon");
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-mode");
  themeIcon.classList.replace("fa-moon", "fa-sun");
}
themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  if (document.body.classList.contains("dark-mode")) {
    themeIcon.classList.replace("fa-moon", "fa-sun");
    localStorage.setItem("theme", "dark");
  } else {
    themeIcon.classList.replace("fa-sun", "fa-moon");
    localStorage.setItem("theme", "light");
  }
});

// ===== Initial Load =====
resetTabs();
myRoutineBtn.classList.add("active");
displayRoutineGrid();
</script>

</body>
</html>
