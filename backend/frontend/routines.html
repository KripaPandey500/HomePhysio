<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Routines - HomePhysio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* ====== Routine Page Custom Styles ====== */
  body {
    background-color: #ffffff;
    color: #333;
    transition: background 0.3s, color 0.3s;
  }

  section.content {
    padding: 6rem 2rem 3rem 2rem;
    max-width: 1100px;
    margin: auto;
  }

  h1 {
    color: var(--primary-color);
    text-align: center;
    margin-bottom: 0.5rem;
  }

  p.subtext {
    text-align: center;
    color: #444;
    margin-bottom: 2rem;
  }

  /* ====== Buttons ====== */
  .buttons-container {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin: 2rem 0;
  }

  .buttons-container button {
    padding: 0.8rem 1.8rem;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 600;
    background: var(--primary-color);
    color: white;
    transition: 0.3s;
  }

  .buttons-container button:hover {
    background: var(--accent-color);
  }

  /* ====== Routine Cards ====== */
.routine-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
  justify-items: center;
}

  .exercise-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    text-align: center;
    transition: transform 0.3s, background 0.3s, color 0.3s;
    position: relative;
    max-width: 300px;
    margin: 0 auto;
  }

  .exercise-card:hover {
    transform: translateY(-5px);
  }

.exercise-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
  border-radius: 8px;
}



  .exercise-card h3 {
    margin: 0.8rem 0 0.3rem;
    color: var(--primary-color);
  }

  .exercise-card p {
    font-size: 0.9rem;
    color: #555;
    margin: 0 1rem 1rem;
  }

  .card-icons {
    display: flex;
    justify-content: center;
    gap: 1.2rem;
    margin-bottom: 1rem;
    font-size: 1.3rem;
  }

  .card-icons i {
    cursor: pointer;
    color: var(--primary-color);
    transition: color 0.3s;
  }

  .card-icons i:hover {
    color: var(--accent-color);
  }

  /* ====== Empty Message ====== */
  .empty-message {
    text-align: center;
    margin-top: 3rem;
    font-size: 1.2rem;
    color: #555;
  }

  .empty-message button {
    margin-top: 1rem;
    background: var(--primary-color);
    color: rgb(255, 255, 255);
    border: none;
    padding: 0.7rem 1.3rem;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
  }

  .empty-message button:hover {
    background: var(--accent-color);
  }

  /* ====== Modal for Instructions ====== */
  .modal {
  display: none;
  position: fixed;
  z-index: 1000;
  inset: 0;
  background-color: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal-content {
  position: relative;  /* <-- Add this */
  background-color: #fff;
  border-radius: 12px;
  width: 90%;
  max-width: 600px;
  padding: 25px 30px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  text-align: left;
  overflow-y: auto;
  max-height: 90vh;
}


.modal-content img {
  width: 100%;
  height: auto;
  border-radius: 10px;
  margin: 15px 0;
  object-fit: contain;
}

.modal-content h2 {
  text-align: center;
  margin-bottom: 10px;
}

.modal-content ul {
  list-style: none;
  padding-left: 0;
}

.modal-content li {
  margin-bottom: 8px;
  font-size: 15px;
  line-height: 1.5;
}

.modal-content li strong {
  color: #0077cc;
}

.modal-content ol {
  margin-left: 20px;
}

/* Light mode */
.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 1.5rem;
  cursor: pointer;
  color: #333;
  z-index: 10;
  transition: color 0.3s;
}

.close-btn:hover {
  color: #0077cc;
}

/* Dark mode */
body.dark-mode .close-btn {
  color: #fff;  /* White color in dark mode */
}

body.dark-mode .close-btn:hover {
  color: #00aaff; /* Optional: hover color for dark mode */
}


  /* ====== Build Routine Section ====== */
  .form-section {
    display: none;
    margin-top: 2rem;
    background: #e6f7ff;
    padding: 1.5rem;
    border-radius: 10px;
    text-align: center;
    transition: background 0.3s, color 0.3s;
  }

  .form-section input[type="text"] {
    padding: 0.7rem;
    width: 60%;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-right: 0.5rem;
    transition: background 0.3s, color 0.3s;
  }

  .form-section button {
    padding: 0.7rem 1.3rem;
    border: none;
    border-radius: 5px;
    background: var(--primary-color);
    color: white;
    cursor: pointer;
    transition: background 0.3s;
  }

/* ====== Dark Mode Styles ====== */
body.dark-mode {
  background-color: #121212;
  color: #e0e0e0;
}

body.dark-mode header {
  background-color: #1e1e1e;
  color: #fff;
}

body.dark-mode .exercise-card {
  background-color: #1e1e1e;
  color: #e0e0e0;
  border: 1px solid #333;
}

body.dark-mode .form-section {
  background-color: #1e1e1e;
  color: #e0e0e0;
  border: 1px solid #333;
}

body.dark-mode .form-section input[type="text"] {
  background-color: #2c2c2c;
  color: #e0e0e0;
  border: 1px solid #555;
}

body.dark-mode .modal-content {
  background-color: #1e1e1e;
  color: #e0e0e0;
  border: 1px solid #333;
}

body.dark-mode .buttons-container button,
body.dark-mode .empty-message button,
body.dark-mode .form-section button {
  background-color: #444;
  color: #fff;
}

body.dark-mode .buttons-container button:hover,
body.dark-mode .empty-message button:hover,
body.dark-mode .form-section button:hover {
  background-color: #888;
}

body.dark-mode .card-icons i {
  color: #bbb;
}

body.dark-mode .card-icons i:hover {
  color: #fff;
}

body.dark-mode footer {
  background-color: #1e1e1e;
  color: #e0e0e0;
}

</style>

</head>

<body>
  <!-- ===== Navbar Section ===== -->
  <header>
    <a href="index.html" class="logo">
      <img src="assets/images/logo.png" alt="HomePhysio Logo">
    </a>
<nav class="nav-links">
  <a href="index.html">Home</a>
  <a href="exercises.html">Exercises</a>
  <a href="routines.html">My Routines</a>
  <a href="progress.html">My Progress</a>
  <a href="aboutus.html">About Us</a>
  <a href="register.html"><i class="fas fa-user-circle"></i></a>
  <button id="theme-toggle" class="theme-toggle">
    <i id="theme-icon" class="fas fa-moon"></i>
  </button>
  
</nav>
  </header>

  <!-- ===== Main Content ===== -->
  <section class="content">
    <h1>My Routines</h1>
    <p class="subtext">Manage and follow your personalized physiotherapy exercises.</p>

    <div class="buttons-container">
      <button id="myRoutineBtn">My Routine</button>
      <button id="buildRoutineBtn">Build Your Routine</button>
    </div>

    <section class="routine-grid" id="routineGrid"></section>

    <div class="empty-message" id="emptyMessage" style="display:none;">
      <p>No routines yet! Create your routine now.</p>
    </div>

    <!-- Build Routine Form -->
    <div class="form-section" id="buildRoutineSection">
      <h3>Create New Routine</h3>
      <input type="text" id="routineName" placeholder="Enter routine name">
      <button id="browseExercises">Browse Exercises</button>
      <button id="saveRoutine">Save Routine</button>
    </div>
  </section>

<!-- ===== Modal for Instructions ===== -->
<div class="modal" id="instructionModal">
<div class="modal-content">
  <span class="close-btn" id="closeModal">&times;</span>
  <h2 id="modalTitle"></h2>       <!-- Move this here -->
  <img id="modalImage" src="" alt="Exercise">
  <p id="modalDesc"></p>
  <ul id="modalDetails"></ul>
</div>
</div>


  <!-- ===== Footer ===== -->
  <footer>
    <p>&copy; 2025 HomePhysio | Follow us on social media</p>
  </footer>



  

  <script>
  const routineGrid = document.getElementById("routineGrid");
  const buildRoutineSection = document.getElementById("buildRoutineSection");
  const myRoutineBtn = document.getElementById("myRoutineBtn");
  const buildRoutineBtn = document.getElementById("buildRoutineBtn");
  const emptyMessage = document.getElementById("emptyMessage");

  // ===== Save Exercise to Local Storage =====
  function saveExercise(ex) {
    let saved = JSON.parse(localStorage.getItem("savedExercises")) || [];
    if (!saved.some(e => e.id === ex.id)) {
      saved.push({
        id: ex.id,
        name: ex.name,
        img: ex.img,
        desc: ex.desc,
        steps: ex.steps,
        duration: ex.duration,
        benefits: ex.benefits,
        sets: ex.sets,     // ✅ Added sets
        reps: ex.reps      // ✅ Added reps
      });
      localStorage.setItem("savedExercises", JSON.stringify(saved));
    }
  }

  // ===== Get Saved Exercises =====
  function getSavedExercises() {
    return JSON.parse(localStorage.getItem("savedExercises")) || [];
  }

  // ===== Display Saved Exercises =====
  function displaySavedExercises() {
    const exercises = getSavedExercises();
    routineGrid.innerHTML = '';

    if (exercises.length === 0) {
      routineGrid.style.display = "none";
      emptyMessage.style.display = "block";
      return;
    }

    emptyMessage.style.display = "none";
    routineGrid.style.display = "grid";

    exercises.forEach(ex => {
      const card = document.createElement("div");
      card.classList.add("exercise-card");
      card.innerHTML = `
        <img src="${ex.img}" alt="${ex.name}">
        <h3>${ex.name}</h3>
        <p>${ex.desc || ''}</p>
        <div class="card-icons">
          <i class="fas fa-eye" onclick="viewInstruction('${ex.id}')"></i>
          <i class="fas fa-play-circle"></i>
          <i class="fas fa-trash" onclick="deleteExercise('${ex.id}')"></i>
        </div>
      `;
      routineGrid.appendChild(card);
    });
  }

  // ===== View Instruction (Modal) =====
  const modal = document.getElementById("instructionModal");
  const closeModal = document.getElementById("closeModal");
  const modalImg = document.getElementById("modalImg");
  const modalName = document.getElementById("modalName");
  const modalDesc = document.getElementById("modalDesc");

 function viewInstruction(id) {
  const exercises = getSavedExercises();
  const ex = exercises.find(e => e.id == id);
  if (!ex) return;

  const modal = document.getElementById("instructionModal");
  const modalTitle = document.getElementById("modalTitle");
  const modalImage = document.getElementById("modalImage");
  const modalDesc = document.getElementById("modalDesc");
  const modalDetails = document.getElementById("modalDetails");

  modalTitle.textContent = ex.name;
  modalImage.src = ex.img;
  modalImage.alt = ex.name;

  
// Inside viewInstruction()
modalDetails.innerHTML = `
  <li><strong>Sets:</strong> ${ex.sets || '-'}</li>
  <li><strong>Reps:</strong> ${ex.reps || '-'}</li>
  <li><strong>Duration:</strong> ${ex.duration || '-'}</li>
  <li><strong>How to do:</strong>
    <ol id="stepsList"></ol>
  </li>
`;

// Add steps
const stepsList = document.getElementById("stepsList");
stepsList.innerHTML = ''; // clear previous
if (ex.howToDo && ex.howToDo.length > 0) {
  ex.howToDo.forEach(step => {
    const li = document.createElement("li");
    li.innerText = step;
    stepsList.appendChild(li);
  });
}

  modal.style.display = "flex";
}


  // ===== Delete Exercise =====
  function deleteExercise(id) {
    let exercises = getSavedExercises();
    // Match both number and string IDs
    exercises = exercises.filter(e => e.id != id && e.id !== id);
    localStorage.setItem("savedExercises", JSON.stringify(exercises));
    displaySavedExercises();
  }

  // ===== Switch Tabs =====
  myRoutineBtn.onclick = () => {
    buildRoutineSection.style.display = "none";
    displaySavedExercises();
  };

  buildRoutineBtn.onclick = () => {
    routineGrid.style.display = "none";
    emptyMessage.style.display = "none";
    buildRoutineSection.style.display = "block";
  };

  // ===== Save Routine (Form) =====
  document.getElementById('browseExercises').onclick = () => {
    window.location.href = 'exercises.html';
  };

  document.getElementById('saveRoutine').onclick = () => {
    const name = document.getElementById('routineName').value.trim();
    if (!name) {
      alert('Please enter a routine name.');
      return;
    }
    alert(`Routine "${name}" saved successfully!`);
    document.getElementById('routineName').value = '';
  };

  
  // ===== Close Modal =====
  closeModal.addEventListener("click", () => {
    modal.style.display = "none";
  });

  window.addEventListener("click", (e) => {
    if (e.target === modal) {
      modal.style.display = "none";
    }
  });

  // ===== Initial Load =====
  displaySavedExercises();

  // ===== Dark Mode Toggle =====
  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');

  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    themeIcon.classList.replace('fa-moon', 'fa-sun');
  }

  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');

    if (document.body.classList.contains('dark-mode')) {
      themeIcon.classList.replace('fa-moon', 'fa-sun');
      localStorage.setItem('theme', 'dark');
    } else {
      themeIcon.classList.replace('fa-sun', 'fa-moon');
      localStorage.setItem('theme', 'light');
    }
  });
</script>

</body>
</html>
