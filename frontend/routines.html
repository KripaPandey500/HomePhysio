<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Routines - HomePhysio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #0077cc;
      --accent-color: #005fa3;
    }

    body {
      background-color: #ffffff;
      color: #333;
      transition: background 0.3s, color 0.3s;
      font-family: "Poppins", sans-serif;
    }

    section.content {
      padding: 6rem 2rem 3rem 2rem;
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 0.5rem;
    }

    p.subtext {
      text-align: center;
      color: #415572;
      margin-bottom: 2rem;
    }

    /* ====== Buttons ====== */
    .buttons-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0;
      flex-wrap: wrap;
    }

    .buttons-container button {
      padding: 0.8rem 1.8rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      background: var(--primary-color);
      color: white;
      transition: 0.3s;
    }

    .buttons-container button:hover {
      background: var(--accent-color);
    }

    .buttons-container button.active {
      background: var(--accent-color);
      transform: scale(1.05);
    }

    /* ====== Routine Cards ====== */
    .routine-grid {
      display: flex;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      justify-items: center;
    }

    .exercise-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s;
      position: relative;
      max-width: 400px;
      
    }

    .exercise-card:hover {
      transform: translateY(-5px);
    }

    .exercise-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid #ddd;
    }

    .exercise-card h3 {
      margin: 0.8rem 0 0.3rem;
      color: var(--primary-color);
      font-size: 1.1rem;
    }

    .exercise-card p {
      font-size: 0.9rem;
      color: #555;
      margin: 0 1rem 1rem;
      min-height: 40px;
    }

    .card-icons {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 1rem;
      font-size: 1.4rem;
    }

    .card-icons i {
      cursor: pointer;
      color: var(--primary-color);
      transition: color 0.3s, transform 0.2s;
    }

    .card-icons i:hover {
      color: var(--accent-color);
      transform: scale(1.2);
    }

    /* ====== Empty Message ====== */
    .empty-message {
      text-align: center;
      margin-top: 3rem;
      font-size: 1.2rem;
      color: #555;
    }

    .empty-message button {
      margin-top: 1rem;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 0.7rem 1.3rem;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
    }

    .empty-message button:hover {
      background: var(--accent-color);
    }

    /* ====== Modal for Instructions ====== */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      position: relative;
      background-color: #fff;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      padding: 25px 30px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      text-align: left;
      overflow-y: auto;
      max-height: 90vh;
    }

    .modal-content img {
      width: 100%;
      border-radius: 10px;
      margin: 15px 0;
      object-fit: contain;
    }

    .modal-content h2 {
      text-align: center;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    .modal-content li {
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 1.5;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #333;
      transition: color 0.3s;
    }

    .close-btn:hover {
      color: var(--accent-color);
    }

    /* ====== Build Routine Section ====== */
    .form-section {
      display: none;
      margin-top: 2rem;
      background: #e6f7ff;
      padding: 1.5rem;
      border-radius: 10px;
      text-align: center;
    }

    .form-section input[type="text"] {
      padding: 0.7rem;
      width: 60%;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-right: 0.5rem;
    }

    .form-section button {
      padding: 0.7rem 1.3rem;
      border: none;
      border-radius: 5px;
      background: var(--primary-color);
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    .form-section button:hover {
      background: var(--accent-color);
    }

    /* ====== Dark Mode Styles ====== */
    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }

    body.dark-mode .exercise-card {
      background-color: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #333;
    }

    body.dark-mode .form-section {
      background-color: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #333;
    }

    body.dark-mode .modal-content {
      background-color: #1e1e1e;
      color: #e0e0e0;
    }

    body.dark-mode .buttons-container button.active {
      background-color: #004c91;
    }

     /* ===== Tabs ===== */
    .buttons-container {
      text-align: center;
      margin-bottom: 2rem;
    }

    .buttons-container button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 0.8rem 1.6rem;
      border-radius: 25px;
      margin: 0 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .buttons-container button.active {
      background: var(--accent-color);
      transform: scale(1.05);
    }

    .buttons-container button:hover {
      background: var(--accent-color);
    }

/* ===== Routine List (Clean Vertical Layout) ===== */
.routine-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 600px;
  margin: 20px auto;
  width: 100%;
}

.routine-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: #f8faff;
  border-radius: 12px;
  border: 1px solid #ddd;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  transition: all 0.3s ease;
  width: 100%;
}

.routine-item:hover {
  background: #eaf4ff;
  transform: translateY(-2px);
}

.routine-info {
  flex: 1;
  font-size: 1.05rem;
  font-weight: 600;
  color: #637589;
  text-align: left;
  overflow-wrap: break-word;
}

.routine-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.routine-actions i {
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--primary-color);
  transition: color 0.3s, transform 0.2s;
}

.routine-actions i:hover {
  color: var(--accent-color);
  transform: scale(1.2);
}

/* ===== Dark Mode for List ===== */
body.dark-mode .routine-item {
  background-color: #252525;
  color: #222c3d;
  border: 1px solid #333;
  box-shadow: 0 2px 8px rgba(255, 255, 255, 0.05);
}

body.dark-mode .routine-item:hover {
  background-color: #e1dede;
}

body.dark-mode .routine-actions i {
  color: #8ab4f8;
}

body.dark-mode .routine-actions i:hover {
  color: #3b7ad9;
}

/* ===== Clean Exercise Selection Modal ===== */
.exercise-modal-content {
  background-color: var(--primary-color);
  color: #fff;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
  width: 90%;
  max-height: 70vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.exercise-modal-content h3 {
  margin-bottom: 15px;
  text-align: center;
}

.exercise-modal-content label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-radius: 8px;
  background-color: #e6f7ff;
  color: #333;
  cursor: pointer;
  transition: background 0.2s;
}

.exercise-modal-content label:hover {
  background-color: #cce6ff;
}

.exercise-modal-content input[type="checkbox"] {
  transform: scale(1.2);
}

.exercise-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 12px;
}

.exercise-modal-actions button {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: 0.3s;
}

.exercise-modal-actions button.save-btn {
  background-color: var(--accent-color);
  color: white;
}

.exercise-modal-actions button.cancel-btn {
  background-color: #ddd;
  color: #333;
}

.exercise-modal-actions button:hover {
  opacity: 0.85;
}


  </style>
</head>
<body>
  <!-- ===== Navbar Section ===== -->
  <header>
    <a href="../index.html" class="logo">
      <img src="assets/images/logo.png" alt="HomePhysio Logo">
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="exercises.html">Exercises</a>
      <a href="routines.html">My Routines</a>
      <a href="progress.html">My Progress</a>
      <a href="aboutus.html">About Us</a>
      <a href="register.html"><i class="fas fa-user-circle"></i></a>
      <button id="theme-toggle" class="theme-toggle">
        <i id="theme-icon" class="fas fa-moon"></i>
      </button>
    </nav>
  </header>

  <!-- ===== Main Content ===== -->
  <section class="content">
    <h1>My Routines</h1>
    <p class="subtext">Manage and follow your personalized physiotherapy exercises.</p>

    <div class="buttons-container">
      <button id="myRoutineBtn">My Routine</button>
      <button id="buildRoutineBtn">Build Your Routine</button>
      <button id="savedExercisesBtn" class="active">Saved Exercises</button>
    </div>

    <section class="routine-grid" id="routineGrid" style="display:none;"></section>
    <div class="empty-message" id="emptyMessage" style="display:none;">
      <p>No routines yet! Create your routine now.</p>
    </div>

    <section class="routine-grid" id="savedExercisesGrid"></section>
    <div class="empty-message" id="savedEmptyMessage" style="display:none;">
      <p>No saved exercises yet!</p>
    </div>

    <div class="form-section" id="buildRoutineSection">
      <h3>Create New Routine</h3>
      <input type="text" id="routineName" placeholder="Enter routine name">
      <button id="saveRoutine">Save Routine</button>
    </div>
  </section>

  <!-- ===== Modal for Instructions ===== -->
  <div class="modal" id="instructionModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2 id="modalTitle"></h2>
      <img id="modalImage" src="" alt="Exercise">
      <p id="modalDesc"></p>
      <ul id="modalDetails"></ul>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 HomePhysio | Follow us on social media</p>
  </footer>

<script>
// ===== Elements =====
const routineGrid = document.getElementById("routineGrid");
const buildRoutineSection = document.getElementById("buildRoutineSection");
const myRoutineBtn = document.getElementById("myRoutineBtn");
const buildRoutineBtn = document.getElementById("buildRoutineBtn");
const savedExercisesBtn = document.getElementById("savedExercisesBtn");
const emptyMessage = document.getElementById("emptyMessage");
const savedExercisesGrid = document.getElementById("savedExercisesGrid");
const savedEmptyMessage = document.getElementById("savedEmptyMessage");
const routineNameInput = document.getElementById("routineName");
const saveRoutineBtn = document.getElementById("saveRoutine");

// ===== Modal =====
const modal = document.getElementById("instructionModal");
const closeModal = document.getElementById("closeModal");
const modalTitle = document.getElementById("modalTitle");
const modalImage = document.getElementById("modalImage");
const modalDesc = document.getElementById("modalDesc");
const modalDetails = document.getElementById("modalDetails");

// ===== Data =====
function getSavedExercises() {
  let exercises = JSON.parse(localStorage.getItem("savedExercises")) || [];
  exercises = exercises.map((ex, index) => {
    if (!ex.id) ex.id = index;
    return ex;
  });
  localStorage.setItem("savedExercises", JSON.stringify(exercises));
  return exercises;
}

function getRoutines() {
  return JSON.parse(localStorage.getItem("routines")) || [];
}

function saveRoutines(routines) {
  localStorage.setItem("routines", JSON.stringify(routines));
}

// ===== Save Routine =====
function saveRoutine(name) {
  if (!name) return alert("Please enter a routine name!");
  const routines = getRoutines();
  routines.push({ id: Date.now(), name, exercises: [] }); // Date.now() is number
  saveRoutines(routines);
  routineNameInput.value = "";
  displayRoutineGrid();
  alert("Routine created successfully!");
}


// ===== Display Routine List =====
function displayRoutineGrid() {
  const routines = getRoutines();
  routineGrid.innerHTML = "";

  if (routines.length === 0) {
    emptyMessage.style.display = "block";
    routineGrid.style.display = "none";
    return;
  }

  emptyMessage.style.display = "none";
  routineGrid.style.display = "flex";

  routines.forEach((routine) => {
    const div = document.createElement("div");
    div.classList.add("routine-item");
    div.innerHTML = `
      <div class="routine-info" data-id="${routine.id}">${routine.name}</div>
      <div class="routine-actions">
        <i class="fas fa-plus-circle add-exercise" data-id="${routine.id}" title="Add Exercises"></i>
        <i class="fas fa-edit edit-routine" data-id="${routine.id}" title="Edit Routine"></i>
        <i class="fas fa-trash delete-routine" data-id="${routine.id}" title="Delete Routine"></i>
      </div>
    `;
    routineGrid.appendChild(div);
  });
}

// ===== Save Exercise to Routine =====
function saveExerciseToRoutine(routineId, exerciseNames) {
  let routines = getRoutines();
  const routine = routines.find(r => r.id === routineId);
  if (!routine) return alert("Routine not found!");
  if (!routine.exercises) routine.exercises = [];

  exerciseNames.forEach(name => {
    if (!routine.exercises.includes(name)) {
      routine.exercises.push(name);
    }
  });

  saveRoutines(routines);
  displayRoutineGrid();
  alert("Exercises added to routine!");
}

routineGrid.addEventListener("click", (e) => {
    const target = e.target;

    // Delete routine
    if (target.classList.contains("delete-routine")) {
        const routineId = parseInt(target.dataset.id); // make sure it's a number
        let routines = getRoutines();
        routines = routines.filter(r => r.id !== routineId); // filter out the one to delete
        saveRoutines(routines);
        displayRoutineGrid(); // refresh the list
        return;
    }

    // Add exercises
    if (target.classList.contains("add-exercise")) {
        const routineId = parseInt(target.dataset.id);
        const exercises = getSavedExercises();
        const exerciseNames = exercises.map(e => e.name);
        showExerciseSelectionModal(routineId, exerciseNames);
        return;
    }

// Edit routine
if (target.classList.contains("edit-routine")) {
    const routineId = target.dataset.id; // string
    let routines = getRoutines();
    const routine = routines.find(r => r.id == routineId); // <- double equals!
    if (!routine) return alert("Routine not found!");

    const newName = prompt("Enter new routine name:", routine.name);
    if (!newName || newName.trim() === "") return;

    routine.name = newName.trim();
    saveRoutines(routines);
    displayRoutineGrid();
    alert("Routine name updated successfully!");
}

    // Click on routine name to display exercises
    if (target.classList.contains("routine-info")) {
        const routineId = parseInt(target.dataset.id);
        const routines = getRoutines();
        const routine = routines.find(r => r.id === routineId);
        if (!routine) return alert("Routine not found!");
        displayExercises(routine.exercises || []);
        resetTabs();
        savedExercisesBtn.classList.add("active");
        savedExercisesGrid.style.display = "grid";
        return;
    }
});


// ===== Modal =====
function viewInstruction(id) {
  const exercises = getSavedExercises();
  const ex = exercises.find((e) => e.id == id);
  if (!ex) return;
  modalTitle.textContent = ex.name;
  modalImage.src = ex.img || ex.image || "assets/images/default.jpg";
  modalDesc.textContent = ex.desc || ex.description || "";
  modalDetails.innerHTML = `
    <li><strong>Sets:</strong> ${ex.sets || "-"}</li>
    <li><strong>Reps:</strong> ${ex.reps || "-"}</li>
    <li><strong>Difficulty:</strong> ${ex.difficulty || "-"}</li>
    <li><strong>Category:</strong> ${ex.category || "-"}</li>
  `;
  modal.style.display = "flex";
}

closeModal.addEventListener("click", () => (modal.style.display = "none"));
window.addEventListener("click", (e) => {
  if (e.target === modal) modal.style.display = "none";
});

// ===== Tabs =====
function resetTabs() {
  [myRoutineBtn, buildRoutineBtn, savedExercisesBtn].forEach(b => b.classList.remove("active"));
  routineGrid.style.display = "none";
  emptyMessage.style.display = "none";
  buildRoutineSection.style.display = "none";
  savedExercisesGrid.style.display = "none";
  savedEmptyMessage.style.display = "none";
}

// ===== Tabs CLICK =====
myRoutineBtn.onclick = () => {
  resetTabs();
  myRoutineBtn.classList.add("active");
  routineGrid.style.display = "flex";
  displayRoutineGrid();
};

buildRoutineBtn.onclick = () => {
  resetTabs();
  buildRoutineBtn.classList.add("active");
  buildRoutineSection.style.display = "block";
};

savedExercisesBtn.onclick = () => {
  resetTabs();
  savedExercisesBtn.classList.add("active");
  savedExercisesGrid.style.display = "grid";
  displayExercises(getSavedExercises()); // show saved exercises
};

// ===== Save Routine to Backend =====
saveRoutineBtn.addEventListener("click", async () => {
  const name = routineNameInput.value.trim();
  const userEmail = localStorage.getItem("loggedInEmail"); // Ensure user login
  if (!name) return alert("Please enter a routine name!");
  if (!userEmail) return alert("You must be logged in to save a routine.");

  try {
    const res = await fetch("http://localhost:5000/routines", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, userEmail })
    });
    const data = await res.json();
    if (res.ok) {
      routineNameInput.value = "";
      buildRoutineSection.style.display = "none";
      myRoutineBtn.classList.add("active");
      buildRoutineBtn.classList.remove("active");
      displayRoutineGrid(); // refresh list
      alert("Routine created successfully!");
    } else {
      alert(data.msg || "Failed to create routine.");
    }
  } catch (err) {
    console.error(err);
    alert("Server error. Could not save routine.");
  }
});

// ===== Display Exercises =====
let selectedExercises = new Set(); // For routine selection
function displayExercises(exercises) {
  savedExercisesGrid.innerHTML = "";
  if (!exercises || exercises.length === 0) {
    savedEmptyMessage.style.display = "block";
    return;
  }
  savedEmptyMessage.style.display = "none";

  exercises.forEach(ex => {
    const card = document.createElement("div");
    card.classList.add("exercise-card");

    const imgSrc = ex.img || ex.image || 'assets/images/default.jpg';
    const selectedClass = selectedExercises.has(ex.id) ? 'selected-exercise' : '';

    card.innerHTML = `
      <img src="${imgSrc}" alt="${ex.name}">
      <h3>${ex.name}</h3>
      <p><strong>Difficulty:</strong> ${ex.difficulty || '-'}</p>
      <div class="card-icons">
        <i class="fas fa-eye view-icon" title="View Instruction" data-id="${ex.id}"></i>
        <i class="fas fa-play-circle play-icon" title="Play" data-id="${ex.id}"></i>
        <i class="fas fa-trash delete-icon" title="Delete Exercise" data-id="${ex.id}"></i>
      </div>
    `;

    savedExercisesGrid.appendChild(card);
  });

  savedExercisesGrid.style.display = "grid";
}

// ===== Delete Exercise from Saved =====
savedExercisesGrid.addEventListener("click", (e) => {
  const id = e.target.dataset.id;
  if (!id) return;
  if (e.target.classList.contains("view-icon")) viewInstruction(id);
  if (e.target.classList.contains("delete-icon")) {
    const updated = getSavedExercises().filter((ex) => ex.id != id);
    localStorage.setItem("savedExercises", JSON.stringify(updated));
    displayExercises(updated);
  }
});

// ===== Dark Mode =====
const themeToggle = document.getElementById("theme-toggle");
const themeIcon = document.getElementById("theme-icon");
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-mode");
  themeIcon.classList.replace("fa-moon", "fa-sun");
}
themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  if (document.body.classList.contains("dark-mode")) {
    themeIcon.classList.replace("fa-moon", "fa-sun");
    localStorage.setItem("theme", "dark");
  } else {
    themeIcon.classList.replace("fa-sun", "fa-moon");
    localStorage.setItem("theme", "light");
  }
});

// ===== Show Modal to Select Exercises =====
function showExerciseSelectionModal(routineId) {
  const routine = getRoutines().find(r => r.id == routineId);

  const allExercises = getSavedExercises(); // all saved exercises
  const modalContent = document.createElement("div");
  modalContent.classList.add("exercise-modal-content");

  modalContent.innerHTML = `
    <h3>Select Exercises</h3>
    <div id="exercise-list">
      ${allExercises.map(ex => `
        <label>
          <span>${ex.name}</span>
          <input type="checkbox" value="${ex.name}" ${routine.exercises.includes(ex.name) ? 'checked' : ''}>
        </label>
      `).join("")}
    </div>
    <div class="exercise-modal-actions">
      <button class="save-btn" id="save-exercises">Save</button>
      <button class="cancel-btn" id="close-exercise-modal">Cancel</button>
    </div>
  `;

  modal.appendChild(modalContent);
  modal.style.display = "flex";

  document.getElementById("save-exercises").onclick = function() {
    const selected = Array.from(modalContent.querySelectorAll("input[type=checkbox]:checked"))
                          .map(i => i.value);
    saveExerciseToRoutine(routineId, selected);
    modalContent.remove();
    modal.style.display = "none";
  };

  document.getElementById("close-exercise-modal").onclick = function() {
    modalContent.remove();
    modal.style.display = "none";
  };
}


// ===== Initial Load =====
resetTabs();
myRoutineBtn.classList.add("active");
displayRoutineGrid();
</script>
