<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - HomePhysio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Modal background */
    .modal {
      display: none; /* hidden by default */
      position: fixed;
      z-index: 200;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.6);
      padding-top: 60px;
    }

    /* Modal content */
    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      border: 1px solid #888;
      width: 90%;
      max-width: 400px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      animation: fadeIn 0.4s;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-50px);}
      to {opacity:1; transform: translateY(0);}
    }

    .modal-header h2 {
      margin: 0;
      text-align: center;
      color: var(--primary-color);
    }

    .modal-body input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .modal-body button {
      width: 100%;
      padding: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .modal-body button:hover {
      background-color: var(--accent-color);
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: var(--primary-color);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <a href="index.html" class="logo">
      <img src="assets/images/logo.png" alt="HomePhysio Logo">
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="exercises.html">Exercises</a>
      <a href="progress.html">My Progress</a>
      <a href="routines.html">My Routines</a>
       <a href="aboutus.html">About Us</a>
      <a href="#" id="profileIcon"><i class="fas fa-user-circle"></i></a>
    </nav>
  </header>
<!-- Registration/Login Modal -->
<div id="authModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>

    <!-- Registration Form -->
    <div id="registerForm">
      <div class="modal-header">
        <h2>Register</h2>
      </div>
      <div class="modal-body">
        <input type="text" id="regName" placeholder="Full Name" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <input type="password" id="regPassword" placeholder="Password" required>
        <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
        <button onclick="registerUser()">Register</button>
        <button onclick="clearRegisterForm()" style="background:#ccc;color:#333;margin-top:5px;">Clear</button>
        <p style="text-align:center;margin-top:10px;">
          Already have an account? <a href="#" onclick="showLoginForm()">Login</a>
        </p>
      </div>
    </div>

    <!-- Login Form -->
    <div id="loginForm" style="display:none;">
      <div class="modal-header">
        <h2>Login</h2>
      </div>
      <div class="modal-body">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button onclick="loginUser()">Login</button>
        <button onclick="clearLoginForm()" style="background:#ccc;color:#333;margin-top:5px;">Clear</button>
        <p style="text-align:center;margin-top:10px;">
          Don't have an account? <a href="#" onclick="showRegisterForm()">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>


<script>
async function checkAuth() {
  try {
    const res = await fetch("http://localhost:5000/profile", {
      credentials: "include",
      headers: { "Accept": "application/json" }
    });
    if (!res.ok) throw new Error("Authentication failed");
    return await res.json();
  } catch (err) {
    console.error("Auth check failed:", err);
    return null;
  }
}

window.onload = async () => {
  try {
    const userData = await checkAuth();
    
    if (!userData) {
      const userName = localStorage.getItem("userName");
      const userEmail = localStorage.getItem("userEmail");
      if (!userName || !userEmail) throw new Error("Not authenticated");
      window.location.href = "login.html";
      return;
    }

    const mainContent = document.createElement('main');
    mainContent.innerHTML = `
      <div style="padding: 20px; text-align: center;">
        <h2>Welcome, ${userData.name}!</h2>
        <p>Your email: ${userData.email}</p>
        <button id="logoutBtn" style="padding: 10px 20px; margin-top: 20px; background: #00aaff; color: white; border: none; border-radius: 5px; cursor: pointer;">Logout</button>
      </div>
    `;
    document.querySelector('header').insertAdjacentElement('afterend', mainContent);

    // ✅ Fixed logout button functionality
    document.getElementById("logoutBtn").onclick = async () => {
      try {
        await fetch("http://localhost:5000/logout", {
          method: "POST",
          credentials: "include"
        });
        localStorage.removeItem("userName");
        localStorage.removeItem("userEmail");
        alert("Logged out successfully!");
        window.location.href = "login.html";
      } catch (err) {
        console.error("Logout failed:", err);
      }
    };

  } catch (err) {
    console.error("Error loading profile:", err);
    window.location.href = "login.html";
  }
};
</script>
