<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - HomePhysio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { 
    font-family: Arial; 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    height:100vh; 
    background:#f0f0f0; 
  }

  .form-container { 
    position: relative;
    background:white; 
    padding:30px; 
    border-radius:12px; 
    box-shadow:0 5px 15px rgba(0,0,0,0.2); 
    width:300px; 
  }

  .close-btn, .back-btn {
    position: absolute;
    top: 10px;
    font-size: 1.5rem;
    font-weight: bold;
    cursor: pointer;
    color: #333;
  }

  .close-btn { right: 15px; }
  .close-btn:hover { color: #00aaff; }

  .back-btn { left: 15px; }
  .back-btn:hover { color: #00aaff; }

  h2 {
    text-align: center;
    color: #00aaff;  
    font-weight: bold;
    margin-bottom: 20px;
  }

  input { 
    width:100%; 
    padding:10px; 
    margin:10px 0; 
    border-radius:6px; 
    border:1px solid #ccc; 
    height:40px;           
    box-sizing: border-box;
  }

  button { 
    width:100%; 
    padding:10px; 
    margin-top:10px; 
    border:none; 
    border-radius:6px; 
    background:#00aaff; 
    color:white; 
    cursor:pointer; 
  }

  .clear-btn { 
    background:#e44848; 
    color:#333; 
    margin-top:5px;
  }

  /* Password wrapper */
  .password-wrapper {
    position: relative;
    width: 100%;
  }

  .password-wrapper input {
    width: 100%;
    padding-right: 35px; 
    height: 40px;        
    border-radius: 6px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }

  .password-wrapper .toggle-password {
    position: absolute;
    right: 10px;             
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #555;
    font-size: 1.1rem;
    user-select: none;
  }
</style>
</head>
<body>

<div class="form-container">
  <span class="close-btn" onclick="window.location.href='index.html'">&times;</span>
  <span class="back-btn" onclick="window.location.href='register.html'">&#8592;</span>
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required>

    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Password" required>
      <i class="fa-regular fa-eye toggle-password"></i>
    </div>

    <button type="submit">Login</button>
    <button type="button" class="clear-btn" onclick="clearFields()">Clear</button>
  </form>
  <p>Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
  // Toggle password visibility
  const togglePassword = document.querySelector('.toggle-password');
  const passwordInput = document.getElementById('password');

  togglePassword.addEventListener('click', () => {
    if(passwordInput.type === 'password'){
      passwordInput.type = 'text';
      togglePassword.classList.remove('fa-eye');
      togglePassword.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      togglePassword.classList.remove('fa-eye-slash');
      togglePassword.classList.add('fa-eye');
    }
  });

  // Login form submit
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("http://localhost:5000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      alert(data.msg);

      if (res.ok && data.msg === "Login successful!"){
        localStorage.setItem("userName", data.user.name);
        localStorage.setItem("userEmail", data.user.email);
        window.location.href = "profile.html";
      } else {
        alert("Login has failed. Please check your details.");
      }
    } catch (err) {
      console.error(err);
      alert("An error occurred during login. Please try again.");
    }
  });

  // Clear input fields
  function clearFields(){
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
  }

  const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();

if (email === "admin@gmail.com") {
  // Call admin login API
  fetch("http://localhost:5000/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  })
    .then(res => res.json())
    .then(data => {
      if (data.msg === "Admin login successful!") {
        localStorage.setItem("loggedInEmail", email);
        alert("Admin successfully logged in!");
        window.location.href = "admin.html"; // redirect to admin panel
      } else {
        alert("Access denied. Invalid credentials!");
      }
    })
    .catch(err => console.error(err));
} else {
  // Normal user login
  fetch("http://localhost:5000/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  })
    .then(res => res.json())
    .then(data => {
      if (data.msg === "Login successful!") {
        localStorage.setItem("loggedInEmail", email);
        alert("User login successful!");
        window.location.href = "home.html"; // redirect to normal user home
      } else {
        alert("Invalid credentials!");
      }
    })
    .catch(err => console.error(err));
}

</script>

</body>
</html>
