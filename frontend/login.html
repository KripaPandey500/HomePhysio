<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - HomePhysio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { 
    font-family: Arial; 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    height:100vh; 
    background:#f0f0f0; 
  }

  .form-container { 
    position: relative;
    background:white; 
    padding:30px; 
    border-radius:12px; 
    box-shadow:0 5px 15px rgba(0,0,0,0.2); 
    width:300px; 
  }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 1.5rem;
    font-weight: bold;
    color: #333;
    cursor: pointer;
  }
  .close-btn:hover { color: #00aaff; }

  input { 
    width:100%; 
    padding:10px; 
    margin:10px 0; 
    border-radius:6px; 
    border:1px solid #ccc; 
    height:40px;           /* ensure consistent height */
    box-sizing: border-box;
  }

  button { 
    width:100%; 
    padding:10px; 
    margin-top:10px; 
    border:none; 
    border-radius:6px; 
    background:#00aaff; 
    color:white; 
    cursor:pointer; 
  }

  /* Password wrapper */
  .password-wrapper {
    position: relative;
    width: 100%;
  }

  .password-wrapper input {
    width: 100%;
    padding-right: 35px; /* space for eye icon */
    height: 40px;        /* same as email input */
    border-radius: 6px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }

  .password-wrapper .toggle-password {
    position: absolute;
    right: 10px;             /* inside the input box */
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #555;
    font-size: 1.1rem;
    user-select: none;
  }
</style>
</head>
<body>

<div class="form-container">
  <span class="close-btn" onclick="window.location.href='index.html'">&times;</span>
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required>

    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Password" required>
      <i class="fa-regular fa-eye toggle-password"></i>
    </div>

    <button type="submit">Login</button>
  </form>
  <p>Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
  // Toggle password visibility
  const togglePassword = document.querySelector('.toggle-password');
  const passwordInput = document.getElementById('password');

  togglePassword.addEventListener('click', () => {
    if(passwordInput.type === 'password'){
      passwordInput.type = 'text';
      togglePassword.classList.remove('fa-eye');
      togglePassword.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      togglePassword.classList.remove('fa-eye-slash');
      togglePassword.classList.add('fa-eye');
    }
  });

  // Login form submit
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("http://localhost:5000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      alert(data.msg);

      if (data.msg === "Login successful!") {
        localStorage.setItem("userName", data.user.name);
        localStorage.setItem("userEmail", data.user.email);
        window.location.href = "profile.html";
      }
    } catch (err) {
      console.error(err);
      alert("Login has failed. Please check your details.");
    }
  });
</script>

</body>
</html>
