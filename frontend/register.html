<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - HomePhysio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: url('assets/images/home-bg.jpg') no-repeat center center fixed; 
      background-size: cover;
      margin: 0; 
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-container {
      background: rgba(255,255,255,0.9); 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
      width: 100%; 
      max-width: 400px;
      position: relative;
    }

    .form-container h2 { 
      text-align: center; 
      color: #00aaff; 
      margin-bottom: 20px;
    }

    .form-container input { 
      width: 100%; 
      padding: 10px; 
      margin: 10px 0; 
      border-radius: 6px; 
      border: 1px solid #ccc; 
    }

    .form-container button { 
      width: 48%; 
      padding: 10px; 
      margin: 5px 1%; 
      border: none; 
      border-radius: 6px; 
      background: #309bd0; 
      color: white; 
      font-size: 1rem; 
      cursor: pointer; 
      transition: 0.3s; 
    }

    .form-container button:hover {
      background: #0088cc;
    }

    .clear-btn { 
      background: #ccc; 
      color: #333; 
    }

    .clear-btn:hover {
      background: #bbb;
    }

    .form-container p { 
      text-align: center; 
      margin-top: 10px; 
    }

    .form-container a { 
      color: #00aaff; 
      text-decoration: none; 
    }

    .form-container a:hover { 
      text-decoration: underline; 
    }

    /* Password eye icon styles */
    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: -5px; /* space for eye icon */
    }

    .password-wrapper .toggle-password {
      position: absolute;
      right: -80px;
      top: 40%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: #555;
      padding: 0;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 22px;
      color: #888;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #333;
    }
  </style>
</head>
<body>

<div class="form-container">
  <span class="close-btn" onclick="window.location.href='index.html'">&times;</span>
  <h2>Register</h2>
  <form id="registerForm">
    <input type="text" id="fullname" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>

    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Password" required>
      <button type="button" class="toggle-password" data-target="password">
        <i class="fa-regular fa-eye"></i>
      </button>
    </div>

    <div class="password-wrapper">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <button type="button" class="toggle-password" data-target="confirmPassword">
        <i class="fa-regular fa-eye"></i>
      </button>
    </div>

    <div style="display:flex; justify-content:space-between;">
      <button type="submit">Register</button>
      <button type="reset" class="clear-btn">Clear</button>
    </div>
  </form>
  <p>Already have an account? <a href="login.html">Login</a></p>
  <p>Or Are you an <a href="adminlogin.html">Admin?</a></p>
</div>

<script>
  // ✅ Toggle password visibility
  document.querySelectorAll(".toggle-password").forEach(button => {
    button.addEventListener("click", () => {
      const targetId = button.getAttribute("data-target");
      const input = document.getElementById(targetId);
      const icon = button.querySelector("i");

      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
        icon.style.color = "#00aaff"; // eye color changes when active
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
        icon.style.color = "#555";
      }
    });
  });

  // ✅ LocalStorage Registration Logic
  document.getElementById("registerForm").addEventListener("submit", (e) => {
    e.preventDefault();

    const name = document.getElementById("fullname").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!name || !email || !password || !confirmPassword) {
      alert("Please fill in all fields!");
      return;
    }

    if (password !== confirmPassword) {
      alert("Passwords do not match!");
      return;
    }

    let db = JSON.parse(localStorage.getItem("db") || '{"users":[],"exercises":[],"routines":[]}');

    if (db.users.some(u => u.email === email)) {
      alert("Email already registered!");
      return;
    }

    db.users.push({ id: db.users.length + 1, name, email, password, image: null });
    localStorage.setItem("db", JSON.stringify(db));

    alert("Registration successful!");
    window.location.href = "login.html";
  });
</script>

</body>
</html>
