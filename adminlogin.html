<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - HomePhysio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1117, #1a1d27, #003d7a);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .box {
      background: white; border-radius: 22px; padding: 2.8rem 2.5rem;
      width: min(440px, 96vw);
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }
    .logo-row {
      display: flex; align-items: center; gap: 0.7rem;
      justify-content: center; margin-bottom: 1.5rem;
    }
    .logo-row img { width: 44px; }
    .logo-row span { font-weight: 900; font-size: 1.2rem; color: #0077cc; }
    .admin-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: #fee2e2; color: #991b1b;
      padding: 0.4rem 1rem; border-radius: 20px;
      font-size: 0.78rem; font-weight: 700;
      margin: 0 auto 1.3rem; display: flex; justify-content: center;
    }
    h2 {
      font-size: 1.55rem; font-weight: 900; color: #1a1a2e;
      text-align: center; margin-bottom: 0.3rem;
    }
    .sub { text-align: center; font-size: 0.84rem; color: #888; margin-bottom: 1.6rem; }
    .err {
      background: #fee2e2; color: #991b1b; border-left: 3px solid #e74c3c;
      padding: 0.7rem 1rem; border-radius: 8px; font-size: 0.84rem;
      font-weight: 600; margin-bottom: 1rem; display: none;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-weight: 700; font-size: 0.83rem;
      color: #444; margin-bottom: 0.4rem;
    }
    .form-group input {
      width: 100%; padding: 0.78rem 1rem;
      border: 2px solid #e0e8f5; border-radius: 11px;
      font-size: 0.92rem; color: #1a1a2e; background: #f8faff;
      transition: 0.2s; font-family: inherit;
    }
    .form-group input:focus { outline: none; border-color: #e74c3c; box-shadow: 0 0 0 3px rgba(231,76,60,0.12); }
    .btn-admin {
      width: 100%; padding: 0.9rem; background: #e74c3c;
      color: white; border: none; border-radius: 11px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer;
      transition: 0.2s; font-family: inherit;
    }
    .btn-admin:hover { background: #c0392b; transform: translateY(-1px); }
    .hint {
      background: #f0f5ff; border-radius: 10px;
      padding: 0.8rem 1rem; font-size: 0.79rem; color: #555;
      margin-top: 1.2rem; line-height: 1.7;
    }
    .hint code {
      background: #e8f4fd; padding: 0.1rem 0.4rem;
      border-radius: 5px; font-family: monospace; color: #0055aa;
    }
    .back-link { text-align: center; margin-top: 1.2rem; font-size: 0.84rem; }
    .back-link a { color: #0077cc; font-weight: 700; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo-row">
      <img src="assets/images/Logo.png" alt="HomePhysio">
      <span>HomePhysio</span>
    </div>
    <div class="admin-badge"><i class="fas fa-shield-alt"></i> Admin Access Only</div>
    <h2>Admin Login</h2>
    <p class="sub">Sign in to manage exercises, users and logs</p>

    <div id="err" class="err"></div>

    <div class="form-group">
      <label><i class="fas fa-envelope"></i> Admin Email</label>
      <input type="email" id="email" placeholder="admin@homephysio.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <input type="password" id="password" placeholder="Admin password" autocomplete="current-password">
    </div>

    <button class="btn-admin" onclick="doLogin()">
      <i class="fas fa-sign-in-alt"></i> &nbsp;Admin Sign In
    </button>

    <div class="hint">
      <i class="fas fa-info-circle"></i>
      Default credentials: <code>admin@homephysio.com</code> / <code>admin123</code><br>
      Created automatically on first server start.
    </div>

    <div class="back-link"><a href="login.html">&larr; Back to Patient Login</a></div>
  </div>

  <script>
const API = '';

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err      = document.getElementById('err');
      err.style.display = 'none';

      if (!email || !password) {
        err.textContent = 'Please fill in both fields.';
        err.style.display = 'block';
        return;
      }

      try {
        const res  = await fetch(`${API}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          err.textContent = data.msg || 'Invalid credentials.';
          err.style.display = 'block';
          return;
        }
        // Admin login successful — redirect to dashboard
        window.location.href = 'admin.html';
      } catch {
        err.textContent = 'Cannot connect to server. Make sure npm start is running in the backend folder.';
        err.style.display = 'block';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
