<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - HomePhysio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #003d7a, #0077cc); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .wrap { display: flex; width: min(900px, 96vw); min-height: 560px; border-radius: 24px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.35); }
    /* Left panel */
    .left { flex: 1; background: linear-gradient(160deg, #001f4d, #0055aa); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem; color: white; text-align: center; }
    .left img { width: 200px; height: 200px; object-fit: contain; border-radius: 16px; margin-bottom: 1.5rem; background: rgba(255,255,255,0.08); padding: 1rem; }
    .left h2 { font-size: 1.45rem; font-weight: 800; margin-bottom: 0.5rem; }
    .left p { font-size: 0.85rem; opacity: 0.85; line-height: 1.7; }
    /* Right panel */
    .right { width: 400px; background: white; padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; background: #f0f4f8; border: none; font-size: 0.95rem; cursor: pointer; color: #888; display: flex; align-items: center; justify-content: center; transition: 0.2s; text-decoration: none; }
    .close-btn:hover { background: #fee2e2; color: #e74c3c; }
    .logo-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.2rem; }
    .logo-row img { width: 36px; }
    .logo-row span { font-weight: 800; font-size: 1.1rem; color: #0077cc; }
    h2 { font-size: 1.4rem; font-weight: 800; color: #1a1a2e; margin-bottom: 0.2rem; }
    p.sub { font-size: 0.84rem; color: #888; margin-bottom: 1.2rem; }
    .fg { margin-bottom: 0.9rem; }
    .fg label { display: block; font-weight: 700; font-size: 0.82rem; color: #444; margin-bottom: 0.35rem; }
    .fg input { width: 100%; padding: 0.72rem 1rem; border: 2px solid #e0e8f5; border-radius: 10px; font-size: 0.9rem; color: #1a1a2e; background: #f8faff; transition: 0.2s; font-family: inherit; }
    .fg input:focus { outline: none; border-color: #0077cc; background: white; box-shadow: 0 0 0 3px rgba(0,119,204,0.1); }
    .err { background: #fee2e2; color: #991b1b; padding: 0.65rem 1rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.8rem; display: none; border-left: 3px solid #e74c3c; }
    .suc { background: #d1fae5; color: #065f46; padding: 0.65rem 1rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.8rem; display: none; border-left: 3px solid #10b981; }
    .btn { width: 100%; padding: 0.88rem; background: #0077cc; color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: 0.2s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn:hover:not(:disabled) { background: #005fa3; }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .divider { text-align: center; font-size: 0.83rem; color: #888; margin: 0.8rem 0; }
    .divider a { color: #0077cc; font-weight: 700; text-decoration: none; }
    @media(max-width: 680px) { .left { display: none; } .right { width: 100%; border-radius: 24px; } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <img src="assets/images/home workout.png" alt="Home Workout" onerror="this.src='assets/images/Logo.png'">
    <h2>Start Your Recovery</h2>
    <p>Create your free account and begin your personalized physiotherapy journey today.</p>
  </div>
  <div class="right">
    <a href="index.html" class="close-btn" title="Back to Home"><i class="fas fa-times"></i></a>
    <div class="logo-row">
      <img src="assets/images/Logo.png" alt="HomePhysio">
      <span>HomePhysio</span>
    </div>
    <h2>Create Account</h2>
    <p class="sub">Free &mdash; takes less than a minute</p>
    <div id="err" class="err"></div>
    <div id="suc" class="suc"></div>
    <div class="fg">
      <label><i class="fas fa-user"></i> Full Name</label>
      <input type="text" id="name" placeholder="Your full name" autocomplete="name">
    </div>
    <div class="fg">
      <label><i class="fas fa-envelope"></i> Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="fg">
      <label><i class="fas fa-lock"></i> Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password">
    </div>
    <div class="fg">
      <label><i class="fas fa-lock"></i> Confirm Password</label>
      <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password">
    </div>
    <button class="btn" id="regBtn" onclick="doRegister()">
      <i class="fas fa-user-plus"></i> Create Account
    </button>
    <div class="divider">Already have an account? <a href="login.html">Sign in here</a></div>
  </div>
</div>

<script>
const API = '';

  async function doRegister() {
    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const pwd     = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const err     = document.getElementById('err');
    const suc     = document.getElementById('suc');
    const btn     = document.getElementById('regBtn');
    err.style.display = 'none';
    suc.style.display = 'none';

    if (!name || !email || !pwd) { err.textContent = 'Please fill in all fields.'; err.style.display = 'block'; return; }
    if (pwd.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.style.display = 'block'; return; }
    if (pwd !== confirm) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

    try {
      const res  = await fetch(`${API}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password: pwd })
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent = data.msg || 'Registration failed.';
        err.style.display = 'block';
      } else {
        suc.textContent = 'Account created! Redirecting to login...';
        suc.style.display = 'block';
        setTimeout(() => window.location.href = 'login.html', 1500);
      }
    } catch {
      err.textContent = 'Cannot connect to server. Make sure npm start is running in the backend folder.';
      err.style.display = 'block';
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
</body>
</html>
