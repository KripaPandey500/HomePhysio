<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - HomePhysio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { margin:0; padding:0; min-height:100vh; background:linear-gradient(135deg,#003d7a,#0077cc); display:flex; align-items:center; justify-content:center; }
    .reg-wrap { display:flex; width:min(900px,96vw); min-height:580px; border-radius:24px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.3); }
    .reg-left { flex:1; background:linear-gradient(160deg,#001f4d,#0055aa); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2.5rem; color:white; text-align:center; }
    .reg-left img { width:200px; height:200px; object-fit:contain; border-radius:16px; margin-bottom:1.5rem; background:rgba(255,255,255,0.08); padding:1rem; }
    .reg-left h2 { font-size:1.5rem; font-weight:800; margin-bottom:0.5rem; }
    .reg-left p { font-size:0.88rem; opacity:0.85; line-height:1.7; }
    .reg-right { width:400px; background:white; padding:2.5rem; display:flex; flex-direction:column; justify-content:center; overflow-y:auto; }
    .reg-right .logo-row { display:flex; align-items:center; gap:0.6rem; margin-bottom:1.2rem; }
    .reg-right .logo-row img { width:36px; }
    .reg-right .logo-row span { font-weight:800; font-size:1.1rem; color:#0077cc; }
    .reg-right h2 { font-size:1.4rem; font-weight:800; color:#1a1a2e; margin-bottom:0.2rem; }
    .reg-right p { font-size:0.85rem; color:#888; margin-bottom:1.2rem; }
    .form-group { margin-bottom:0.9rem; }
    .form-group label { display:block; font-weight:700; font-size:0.85rem; color:#444; margin-bottom:0.35rem; }
    .form-group input { width:100%; padding:0.72rem 1rem; border:2px solid #e0e8f5; border-radius:10px; font-size:0.9rem; color:#1a1a2e; background:#f8faff; transition:0.2s; }
    .form-group input:focus { outline:none; border-color:#0077cc; background:white; box-shadow:0 0 0 3px rgba(0,119,204,0.1); }
    .err { background:#fee2e2; color:#991b1b; padding:0.65rem 1rem; border-radius:8px; font-size:0.85rem; font-weight:600; margin-bottom:0.8rem; display:none; border-left:3px solid #e74c3c; }
    .btn-reg { width:100%; padding:0.85rem; background:#0077cc; color:white; border:none; border-radius:10px; font-size:0.95rem; font-weight:700; cursor:pointer; transition:0.2s; margin-top:0.3rem; }
    .btn-reg:hover { background:#005fa3; }
    .divider { text-align:center; font-size:0.85rem; color:#888; margin:0.8rem 0; }
    .divider a { color:#0077cc; font-weight:700; text-decoration:none; }
    @media(max-width:700px){ .reg-left{display:none;} .reg-right{width:100%;border-radius:24px;} }
  </style>
</head>
<body>
  <div class="reg-wrap">
    <div class="reg-left">
      <img src="assets/images/home workout.png" alt="Home Workout" onerror="this.src='assets/images/Logo.png'">
      <h2>Start Your Recovery</h2>
      <p>Create your free account and begin your personalized physiotherapy journey today.</p>
    </div>
    <div class="reg-right">
      <div class="logo-row">
        <img src="assets/images/Logo.png" alt="HomePhysio">
        <span>HomePhysio</span>
      </div>
      <h2>Create Account</h2>
      <p>Free — takes less than a minute</p>
      <div id="err" class="err"></div>
      <div class="form-group">
        <label><i class="fas fa-user"></i> Full Name</label>
        <input type="text" id="name" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" placeholder="At least 6 characters">
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Confirm Password</label>
        <input type="password" id="confirm" placeholder="Repeat your password">
      </div>
      <button class="btn-reg" onclick="doRegister()"><i class="fas fa-user-plus"></i> &nbsp;Create Account</button>
      <div class="divider">Already have an account? <a href="login.html">Sign in here</a></div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000';
    async function doRegister() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const err = document.getElementById('err');
      err.style.display = 'none';
      if (!name || !email || !password) { err.textContent = 'Please fill in all fields.'; err.style.display = 'block'; return; }
      if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.style.display = 'block'; return; }
      if (password !== confirm) { err.textContent = 'Passwords do not match. Please check and try again.'; err.style.display = 'block'; return; }
      try {
        const res = await fetch(`${API}/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, email, password}) });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.msg; err.style.display = 'block'; return; }
        alert('Account created successfully! Please sign in.');
        window.location.href = 'login.html';
      } catch { err.textContent = 'Cannot connect to server. Make sure npm start is running.'; err.style.display = 'block'; }
    }
  </script>
</body>
</html>
