<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - HomePhysio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Modal background */
    .modal {
      display: none; /* hidden by default */
      position: fixed;
      z-index: 200;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.6);
      padding-top: 60px;
    }

    /* Modal content */
    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      border: 1px solid #888;
      width: 90%;
      max-width: 400px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      animation: fadeIn 0.4s;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-50px);}
      to {opacity:1; transform: translateY(0);}
    }

    .modal-header h2 {
      margin: 0;
      text-align: center;
      color: var(--primary-color);
    }

    .modal-body input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .modal-body button {
      width: 100%;
      padding: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .modal-body button:hover {
      background-color: var(--accent-color);
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: var(--primary-color);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <a href="index.html" class="logo">
      <img src="assets/images/logo.png" alt="HomePhysio Logo">
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="exercises.html">Exercises</a>
      <a href="progress.html">My Progress</a>
      <a href="routines.html">My Routines</a>
      <a href="#" id="profileIcon"><i class="fas fa-user-circle"></i></a>
    </nav>
  </header>
<!-- Registration/Login Modal -->
<div id="authModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>

    <!-- Registration Form -->
    <div id="registerForm">
      <div class="modal-header">
        <h2>Register</h2>
      </div>
      <div class="modal-body">
        <input type="text" id="regName" placeholder="Full Name" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <input type="password" id="regPassword" placeholder="Password" required>
        <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
        <button onclick="registerUser()">Register</button>
        <button onclick="clearRegisterForm()" style="background:#ccc;color:#333;margin-top:5px;">Clear</button>
        <p style="text-align:center;margin-top:10px;">
          Already have an account? <a href="#" onclick="showLoginForm()">Login</a>
        </p>
      </div>
    </div>

    <!-- Login Form -->
    <div id="loginForm" style="display:none;">
      <div class="modal-header">
        <h2>Login</h2>
      </div>
      <div class="modal-body">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button onclick="loginUser()">Login</button>
        <button onclick="clearLoginForm()" style="background:#ccc;color:#333;margin-top:5px;">Clear</button>
        <p style="text-align:center;margin-top:10px;">
          Don't have an account? <a href="#" onclick="showRegisterForm()">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>


<script>
  const modal = document.getElementById("authModal");
  const profileBtn = document.getElementById("profileIcon");
  const closeBtn = document.getElementsByClassName("close")[0];

  const registerForm = document.getElementById("registerForm");
  const loginForm = document.getElementById("loginForm");

  // Open modal
  profileBtn.onclick = function() {
    modal.style.display = "block";
    showRegisterForm(); // default
  }

  // Close modal
  closeBtn.onclick = function() {
    modal.style.display = "none";
  }

  window.onclick = function(event) {
    if(event.target == modal) modal.style.display = "none";
  }

  // Show/hide forms
  function showLoginForm() {
    registerForm.style.display = "none";
    loginForm.style.display = "block";
  }

  function showRegisterForm() {
    loginForm.style.display = "none";
    registerForm.style.display = "block";
  }

  // Registration
  function registerUser() {
    const name = document.getElementById("regName").value;
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;
    const confirmPassword = document.getElementById("regConfirmPassword").value;

    if(!name || !email || !password || !confirmPassword){
      alert("Please fill in all fields!");
      return;
    }
    if(password !== confirmPassword){
      alert("Passwords do not match!");
      return;
    }

    alert(`Registration successful!\nName: ${name}\nEmail: ${email}`);
    clearRegisterForm();
    modal.style.display = "none";
  }

  function clearRegisterForm() {
    document.getElementById("regName").value = '';
    document.getElementById("regEmail").value = '';
    document.getElementById("regPassword").value = '';
    document.getElementById("regConfirmPassword").value = '';
  }

  // Login
  function loginUser() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    if(!email || !password){
      alert("Please fill in all fields!");
      return;
    }

    alert(`Login successful!\nEmail: ${email}`);
    clearLoginForm();
    modal.style.display = "none";
  }

  function clearLoginForm() {
    document.getElementById("loginEmail").value = '';
    document.getElementById("loginPassword").value = '';
  }
</script>
