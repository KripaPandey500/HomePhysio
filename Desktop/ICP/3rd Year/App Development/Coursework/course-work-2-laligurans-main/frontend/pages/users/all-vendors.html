<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Vendors</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; }
        .container { width: 90%; margin: 40px auto; background: #fff; padding: 2rem; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
        th, td { padding: 10px; border: 1px solid #e5e7eb; text-align: left; }
        th { background: #f59e42; color: #fff; }
        tr:nth-child(even) { background: #f1f5f9; }
        h2 { color: #f59e42; }
    </style>
</head>
<body>
<div class="container">
    <h2>All Vendors</h2>
    <table id="vendorsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
<script>
fetch('http://localhost:5033/api/users')
    .then(res => res.json())
    .then(users => {
        const tbody = document.querySelector('#vendorsTable tbody');
        tbody.innerHTML = '';
        users.forEach(u => {
            if(u.role && u.role.toUpperCase() === 'VENDOR') {
                tbody.innerHTML += `<tr><td>${u.id}</td><td>${u.firstName}</td><td>${u.lastName}</td><td>${u.email}</td><td>${u.phone||''}</td><td>${u.role}</td></tr>`;
            }
        });
    });
</script>
</body>
</html>
